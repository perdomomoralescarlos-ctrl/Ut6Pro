<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tienda de Videojuegos</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    body {
      margin: 0;
    }

    header {
      background: #202a44;
      color: #fff;
      padding: 24px;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    section {
      margin-top: 24px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border: 1px solid #dbe1ea;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #e6ebf2;
      text-align: left;
    }

    th {
      background: #edf2f7;
    }

    input, button {
      min-height: 38px;
      border: 1px solid #b9c3d0;
      border-radius: 6px;
      padding: 0 10px;
      font: inherit;
    }

    button {
      background: #1f6feb;
      color: #fff;
      border-color: #1f6feb;
      cursor: pointer;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <header>
    <h1>Tienda de Videojuegos</h1>
  </header>
  <main>
    <section>
      <div class="toolbar">
        <input id="search" placeholder="Buscar por titulo">
        <button id="searchBtn">Buscar</button>
        <button id="allBtn">Ver todos</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Titulo</th>
            <th>Genero</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Plataforma</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </section>
  </main>
  <script>
    const rows = document.querySelector("#rows");
    const search = document.querySelector("#search");

    async function loadVideojuegos(url = "/api/v1/videojuegos") {
      const response = await fetch(url);
      const videojuegos = await response.json();
      rows.innerHTML = videojuegos.map((juego) => `
        <tr>
          <td>${juego.id}</td>
          <td>${juego.titulo}</td>
          <td>${juego.genero}</td>
          <td>${juego.precio.toFixed(2)} EUR</td>
          <td>${juego.stock}</td>
          <td>${juego.plataforma?.nombre ?? ""}</td>
        </tr>
      `).join("");
    }

    document.querySelector("#searchBtn").addEventListener("click", () => {
      loadVideojuegos(`/api/v1/videojuegos/buscar?titulo=${encodeURIComponent(search.value)}`);
    });

    document.querySelector("#allBtn").addEventListener("click", () => {
      search.value = "";
      loadVideojuegos();
    });

    loadVideojuegos();
  </script>
</body>
</html>
